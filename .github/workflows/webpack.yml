name: RunClub validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-for-auth

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Node dependencies
      run: npm ci
      env:
        PRISMA_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/runclub_build

    - name: Install Garmin reader dependencies
      run: python -m pip install -r garmin-sync/requirements.txt

    - name: Validate Prisma schema
      run: npx prisma validate
      env:
        PRISMA_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/runclub_build

    - name: Test Garmin reader
      run: python -m unittest discover -s garmin-sync -p 'test_*.py' -v

    - name: Build Next.js application
      run: npm run build
